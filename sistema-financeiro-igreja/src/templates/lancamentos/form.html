{% extends "base.html" %}

{% block title %}{{ "Editar" if lancamento else "Novo" }} lançamento{% endblock %}

{% block content %}
<h1>{{ "Editar" if lancamento else "Novo" }} lançamento</h1>

<form method="post" class="col-md-6">
    <div class="mb-3">
        <label class="form-label" for="categoria_id">Categoria</label>
        <select id="categoria_id" name="categoria_id" class="form-select" required>
            <option value="">Selecione...</option>
            {% for c in categorias %}
            <option value="{{ c.id }}" {% if valores.get('categoria_id')|string == c.id|string %}selected{% endif %}>
                {{ c.nome }} ({{ "Entrada" if c.tipo == "entrada" else "Saída" }})
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="valor">Valor (R$)</label>
        <input type="text" id="valor" name="valor" class="form-control" placeholder="150,00" value="{{ valores.get('valor', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="data">Data</label>
        <input type="text" id="data" name="data" class="form-control" placeholder="DD/MM/AAAA" value="{{ valores.get('data', '') }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="contribuinte_id">Contribuinte (opcional)</label>
        <select id="contribuinte_id" name="contribuinte_id" class="form-select">
            <option value="">Nenhum</option>
            {% for c in contribuintes %}
            <option value="{{ c.id }}" {% if valores.get('contribuinte_id')|string == c.id|string %}selected{% endif %}>{{ c.nome }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="descricao">Descrição (opcional)</label>
        <input type="text" id="descricao" name="descricao" class="form-control" value="{{ valores.get('descricao', '') }}">
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('lancamento.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
